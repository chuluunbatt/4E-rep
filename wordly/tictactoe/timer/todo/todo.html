<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./todo.css" />
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>To-do List</h1>

            <div class="header">
                <input type="text" placeholder="Add a new task..." />
                <button>Add</button>
            </div>

            <div class="filters">
                <button class="active">All</button>
                <button>Active</button>
                <button>Completed</button>
            </div>

            <div class="list"></div>

            <div class="footer">
                <p>0 items left</p>
                <button>Clear Completed</button>
            </div>
            <div class="pine">
                <span class="x">Powerred by</span>
                <span class="Pinecone ">Pinecone academy
                </span>
            </div>

        </div>
    </div>

    <script src="./todo.js"></script>
</body>

</html>
